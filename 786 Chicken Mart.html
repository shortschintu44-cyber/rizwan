<script id="m-app">
(()=>{
const $=s=>document.querySelector(s),D=JSON.parse($('#m-data').textContent);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={cat:'All',q:'',qty:{},cart:{},f:{}};
try{S.cart=JSON.parse(localStorage.getItem('m786')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('m786',JSON.stringify(S.cart))}catch(e){}};
const P=id=>D.products.find(p=>p.id===id),ok=p=>!!p&&p.on&&p.price>0;
const rs=n=>'₹'+(+n.toFixed(2)).toLocaleString('en-IN');
const wa=t=>`https://wa.me/91${D.phone}?text=${encodeURIComponent(t)}`;
const cats=[...new Set(D.products.map(p=>p.cat))];
const lines=()=>Object.entries(S.cart).filter(([id])=>ok(P(id))).map(([id,q])=>({p:P(id),q,t:P(id).price*q}));
const sub=()=>lines().reduce((a,l)=>a+l.t,0);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)};
const badge=()=>{$('#cc').textContent=lines().length};
const tel=`tel:+91${D.phone}`,mapU=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(D.address)}`;
const LOGO='<svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#a1121f" stroke="#c9a24a" stroke-width="2.5"/><text x="24" y="30" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="800" font-size="17" fill="#fff">786</text></svg>';
const qtyc=(id,act,v)=>`<div class="qty"><button aria-label="Less" data-act="${act}" data-id="${id}" data-d="-0.5">−</button><span class="qv" data-id="${id}">${v}</span><button aria-label="More" data-act="${act}" data-id="${id}" data-d="0.5">+</button><em>kg</em></div>`;
const priceH=p=>p.price>0?`<p class="pr">${rs(p.price)}<small> /kg</small></p>`:'<p class="pr none">Rate not set yet</p>';
const buy=p=>ok(p)?`<div class="buy">${qtyc(p.id,'q',S.qty[p.id]||1)}<button class="btn red" data-act="add" data-id="${p.id}">Add to Cart</button></div>`:`<button class="btn dis" disabled>${p.on?'Rate coming soon':'Not available today'}</button>`;
const card=p=>`<article class="card"><a href="#product-${p.id}"><img src="${p.img}" alt="${E(p.name)}" loading="lazy" width="600" height="383"></a><div class="cb"><h3><a href="#product-${p.id}">${E(p.name)}</a></h3>${priceH(p)}${buy(p)}</div></article>`;
const grid=()=>{const q=S.q.trim().toLowerCase(),l=D.products.filter(p=>(S.cat==='All'||p.cat===S.cat)&&p.name.toLowerCase().includes(q));return l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="empty">No products match. Clear the search or choose All.</p>'};
const sec=(t,b,c='')=>`<section class="wrap s ${c}"><h2>${t}</h2>${b}</section>`;
const contact=()=>`<div class="panel"><p><b>Call / WhatsApp:</b> <a href="${tel}">${E(D.phone)}</a></p><p><b>Address:</b> ${E(D.address)}</p><p><b>Delivery hours:</b> ${E(D.hours)}</p><p><a class="btn gold" href="${wa('Hello 786 Chicken Mart')}" target="_blank" rel="noopener">WhatsApp us</a> <a class="btn red" href="${mapU}" target="_blank" rel="noopener">Open in Google Maps</a></p></div>`;
const page=(t,b)=>`<div class="wrap s"><h1>${t}</h1>${b}</div>`;
const V={
home:()=>{const b=D.products.filter(p=>p.fav&&p.on),bs=(b.length?b:D.products.filter(p=>p.on)).slice(0,4),h=P('03')||D.products[0],bd=D.products.filter(ok).slice(0,4);
return{t:'Fresh Chicken, Free Home Delivery',d:'Order fresh chicken online from 786 Chicken Mart. Free home delivery, free chicken masala, easy WhatsApp ordering.',h:`<section class="hero"><div class="wrap hg"><div class="in"><h1>Fresh Chicken. Premium Quality. Delivered to Your Door.</h1><p class="sub">Quality you trust, freshness you deserve.</p><div class="cta"><a class="btn red lg" href="${wa('Hello 786 Chicken Mart, I would like to place an order.')}" target="_blank" rel="noopener">Order Now</a><a class="btn line lg" href="#shop">Shop Products</a></div></div><figure class="hf"><img src="${h.img}" alt="Fresh chicken from 786 Chicken Mart" width="600" height="383">${bd.length?`<figcaption><b>Today’s rates</b>${D.ratesDate?`<small>${E(D.ratesDate)}</small>`:''}<ul>${bd.map(p=>`<li><span>${E(p.name)}</span><b>${rs(p.price)}/kg</b></li>`).join('')}</ul></figcaption>`:''}</figure></div></section>
<div class="wrap promos"><div class="promo r"><b>Free home delivery</b><span>Within ${E(D.radius)} · ${E(D.hours)}</span></div><div class="promo g"><b>Free chicken masala</b><span>With your order</span></div></div>
${sec('Best Sellers',`<div class="grid">${bs.map(card).join('')}</div>`)}
${sec('Our Products',`<div class="tiles">${cats.map(c=>`<button class="tile" data-act="cat" data-id="${E(c)}">${E(c)}<small>${D.products.filter(p=>p.cat===c).length} items</small></button>`).join('')}</div>`)}
<section class="offer"><div class="wrap"><div class="ob"><h2>786 CHICKEN MART — SPECIAL OFFER</h2><ul><li>FREE HOME DELIVERY within ${E(D.radius)}.</li><li>Delivery hours: ${E(D.hours)}.</li><li>Get FREE Chicken Masala with your order.</li><li>Online ordering available.</li><li>Call / WhatsApp: <a href="${tel}">${E(D.phone)}</a></li></ul><a class="btn gold lg" href="#shop">GRAB THIS OFFER — ORDER NOW</a></div></div></section>
${sec('Why Choose Us','<div class="why"><div><i>✓</i><b>Freshness</b>Fresh chicken for every order.</div><div><i>✓</i><b>Quality</b>Cuts you can trust, every time.</div><div><i>✓</i><b>Hygiene</b>Clean handling from shop to door.</div><div><i>✓</i><b>Convenient delivery</b>Free home delivery, 6 AM to 6 PM.</div></div>')}
${sec('Customer Reviews',D.reviews.length?`<div class="rv">${D.reviews.map(r=>`<blockquote>${E(r.t)}<cite>${E(r.n)}</cite></blockquote>`).join('')}</div>`:`<p class="mut">Reviews from our customers will appear here.</p><a class="btn red" href="${wa('Hello 786 Chicken Mart, I want to share a review: ')}" target="_blank" rel="noopener">Send us your review on WhatsApp</a>`)}
${sec('Contact Us',contact())}`}},
shop:()=>({t:'Shop All Chicken',d:'Browse all chicken cuts with today’s rate per kg and order online.',h:`<div class="wrap s"><h1>Shop All</h1><p class="mut">Prices are per kilogram and can change daily.</p><div class="chips">${['All',...cats].map(c=>`<button class="chip${S.cat===c?' on':''}" data-act="cat" data-id="${E(c)}">${E(c)}</button>`).join('')}</div><div id="pg">${grid()}</div></div>`}),
product:id=>{const p=P(id);if(!p)return{t:'Not found',d:'',h:page('Product not found','<a class="btn red" href="#shop">Back to Shop</a>')};
return{t:p.name,d:`Buy ${p.name} online from 786 Chicken Mart. Free home delivery within ${D.radius}.`,h:`<div class="wrap s"><p><a href="#shop">← All products</a></p><div class="two"><img src="${p.img}" alt="${E(p.name)}" width="600" height="383"><div><h1>${E(p.name)}</h1><p class="mut">${E(p.cat)}</p>${priceH(p)}<div style="max-width:380px;margin:14px 0">${buy(p)}</div><ul><li>Free chicken masala with your order</li><li>Free home delivery within ${E(D.radius)}, ${E(D.hours)}</li></ul><p class="note">Rates change daily. The final amount is confirmed with you on WhatsApp.</p></div></div></div>`}},
about:()=>({t:'About Us',d:'About 786 Chicken Mart, a fresh chicken shop offering home delivery.',h:page('About 786 Chicken Mart',`<div style="max-width:680px"><p>786 Chicken Mart is a fresh chicken shop at ${E(D.address)}. We sell chicken in the cuts families cook with most, from curry cut and biryani cut to boneless, wings, legs and country chicken.</p><p>You can order here, send the order to us on WhatsApp, and we deliver to your door. Every order comes with free chicken masala.</p><a class="btn red" href="#shop">Shop Products</a></div>`)}),
delivery:()=>({t:'Delivery Information',d:'Free home delivery, delivery hours and how ordering works at 786 Chicken Mart.',h:page('Delivery Information',`<div style="max-width:680px"><div class="panel"><p><b>Free delivery area:</b> within ${E(D.radius)} of the shop.</p><p><b>Delivery hours:</b> ${E(D.hours)}.</p><p><b>Extra charges:</b> none within the free delivery area.</p><p><b>Free gift:</b> chicken masala with your order.</p></div><h3 style="margin-top:22px">How it works</h3><ol><li>Add products to your cart and enter your address and preferred delivery time.</li><li>Tap Place Order on WhatsApp. Your order opens as a message to the shop.</li><li>Send it. Your order is confirmed when the shop replies.</li></ol><p>Outside the free delivery area, please call or WhatsApp us first to ask if we can deliver to you.</p><p class="note">Payment is settled directly with the shop; confirm how on WhatsApp. This website does not take online payments or track orders.</p></div>`)}),
contact:()=>({t:'Contact Us',d:'Call, WhatsApp or visit 786 Chicken Mart.',h:page('Contact Us',`<div class="cbox">${contact()}<div class="panel"><h3>Send a message</h3><label class="f" for="cn">Your name</label><input class="i" id="cn" data-f="cn" value="${E(S.f.cn)}"><label class="f" for="cm">Message</label><textarea class="i" id="cm" rows="4" data-f="cm">${E(S.f.cm)}</textarea><p><button class="btn red" data-act="msg">Send on WhatsApp</button></p></div></div>`)}),
privacy:()=>({t:'Privacy Policy',d:'How 786 Chicken Mart handles your information.',h:page('Privacy Policy','<div style="max-width:680px"><p>When you order, you enter your name, phone number, delivery address and preferred delivery time. This website does not store them on any server. They are placed in a WhatsApp message that you choose to send to the shop.</p><p>Your cart is saved only in your own browser on your device. Clear your browser data to remove it.</p><p>We use your details only to deliver your order and to contact you about it. We do not sell or share them. Once a message is sent, WhatsApp’s own privacy policy applies to it.</p><p>To ask us to delete the details we hold about you, call or WhatsApp us.</p></div>')}),
terms:()=>({t:'Terms and Conditions',d:'Terms of ordering from 786 Chicken Mart.',h:page('Terms and Conditions',`<div style="max-width:680px"><ul><li>Rates are per kilogram, change daily, and are shown for guidance. The shop confirms your final amount on WhatsApp.</li><li>An order is confirmed only after the shop replies on WhatsApp.</li><li>Free home delivery applies within ${E(D.radius)} of the shop, during ${E(D.hours)}.</li><li>Products can be unavailable on a given day.</li><li>This website does not take online payments. Payment is settled with the shop.</li><li>Free chicken masala is given with your order while the offer runs.</li></ul></div>`)}),
cart:()=>{const L=lines(),T=sub(),slots=['As soon as possible',...Array.from({length:12},(_,i)=>{const h=6+i,t=x=>`${(x+11)%12+1}:00 ${x<12?'AM':'PM'}`;return t(h)+' – '+t(h+1)})];
if(!S.f.tm)S.f.tm=slots[0];
return{t:'Cart and Checkout',d:'Review your cart and place your order on WhatsApp.',h:page('Your Cart',!L.length?'<div class="empty"><p>Your cart is empty.</p><a class="btn red" href="#shop">Shop Products</a></div>':`<div class="two"><div>${L.map(l=>`<div class="cl"><img src="${l.p.img}" alt=""><div><b>${E(l.p.name)}</b><br><small class="mut">${rs(l.p.price)} /kg</small></div><b>${rs(l.t)}</b>${qtyc(l.p.id,'cq',l.q)}<button class="rm" data-act="rm" data-id="${l.p.id}">Remove</button></div>`).join('')}<p><button class="rm" data-act="clr">Clear cart</button></p></div><div class="sum"><div class="row"><span>Subtotal</span><b>${rs(T)}</b></div><div class="row"><span>Delivery (within ${E(D.radius)})</span><b>FREE</b></div><div class="row"><span>Chicken masala</span><b>FREE</b></div><div class="row tot"><span>Order total</span><span>${rs(T)}</span></div>
<label class="f" for="nm">Name</label><input class="i" id="nm" data-f="nm" autocomplete="name" value="${E(S.f.nm)}"><label class="f" for="ph">Phone number</label><input class="i" id="ph" data-f="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number" value="${E(S.f.ph)}"><label class="f" for="ad">Delivery address</label><textarea class="i" id="ad" rows="3" data-f="ad" autocomplete="street-address">${E(S.f.ad)}</textarea><label class="f" for="tm">Preferred delivery time (${E(D.hours)})</label><select class="i" id="tm" data-f="tm">${slots.map(s=>`<option${S.f.tm===s?' selected':''}>${s}</option>`).join('')}</select>
<p class="note">Delivery is free within ${E(D.radius)}. Outside it, call or WhatsApp us first. No online payment on this site; the shop confirms your final amount and payment on WhatsApp.</p><p class="err" id="err" role="alert"></p><button class="btn red lg" style="width:100%" data-act="order">Place Order on WhatsApp</button></div></div>`)}},
admin:()=>({t:'Owner Admin',d:'',h:'<div class="wrap s" id="adm"><p>Checking access…</p></div>'})
};
let cur=location.hash.slice(1)||'home';
function render(){const[t,id]=cur.split(/-(.+)/),o=(V[t]||V.home)(id);document.title=o.t+' | 786 Chicken Mart';const m=$('meta[name=description]');if(o.d)m.content=o.d;$('#root').innerHTML=o.h;badge();if(t==='admin')adm()}
function go(t){cur=t;if(location.hash.slice(1)!==t)try{location.hash=t}catch(e){}$('#nav')?.classList.remove('open');render();scrollTo(0,0)}
addEventListener('hashchange',()=>{const t=location.hash.slice(1)||'home';if(t!==cur){cur=t;render();scrollTo(0,0)}});
const hdr=()=>`<div class="bar">FREE home delivery within ${E(D.radius)} · ${E(D.hours)} · Free chicken masala with your order</div><header><div class="wrap hw"><a class="logo" href="#home">${LOGO}<span>786 <b>Chicken Mart</b></span></a><button class="mb" data-act="menu" aria-label="Menu">☰</button><nav id="nav"><a href="#home">Home</a><a href="#shop">Shop All</a><a href="#about">About Us</a><a href="#delivery">Delivery</a><a href="#contact">Contact Us</a></nav><label class="sr" for="sq">Search products</label><input id="sq" type="search" placeholder="Search chicken cuts"><a class="cartb" href="#cart">Cart <span id="cc">0</span></a></div></header>`;
const ftr=()=>`<footer><div class="wrap"><div><h3>786 Chicken Mart</h3><p>Fresh chicken, delivered to your door.<br>${E(D.address)}<br><a href="${tel}">${E(D.phone)}</a></p></div><div><h3>Pages</h3><a href="#shop">Shop All</a><a href="#about">About Us</a><a href="#delivery">Delivery Information</a><a href="#contact">Contact Us</a></div><div><h3>Legal</h3><a href="#privacy">Privacy Policy</a><a href="#terms">Terms and Conditions</a><a href="#admin">Owner login</a><p class="note">© ${new Date().getFullYear()} 786 Chicken Mart</p></div></div></footer><div class="fab"><a href="${wa('Hello 786 Chicken Mart')}" target="_blank" rel="noopener" style="background:#1f9d55" aria-label="WhatsApp">WA</a><a href="${tel}" style="background:var(--r)" aria-label="Call">Call</a></div>`;
const err=m=>{$('#err').textContent=m;return false};
function order(){const v=k=>(S.f[k]||'').trim(),ph=v('ph').replace(/[\s-]/g,'').replace(/^(\+91|91|0)(?=\d{10}$)/,''),L=lines();
if(!L.length)return err('Your cart is empty.');if(v('nm').length<2)return err('Please enter your name.');if(!/^[6-9]\d{9}$/.test(ph))return err('Enter a valid 10-digit Indian mobile number.');if(v('ad').length<10)return err('Please enter your full delivery address.');
const T=sub(),m=`*New Order – 786 Chicken Mart*\n\n*Name:* ${v('nm')}\n*Phone:* ${ph}\n*Address:* ${v('ad')}\n*Delivery time:* ${S.f.tm}\n\n*Items:*\n${L.map((l,i)=>`${i+1}. ${l.p.name} – ${l.q} kg × ${rs(l.p.price)} = ${rs(l.t)}`).join('\n')}\n\n*Subtotal:* ${rs(T)}\n*Delivery:* FREE (within ${D.radius})\n*Free chicken masala included*\n*Order total:* ${rs(T)}`;
const a=document.createElement('a');a.href=wa(m);a.target='_blank';a.rel='noopener';a.click();err('');toast('WhatsApp opened. Send the message to confirm your order.')}
const resize=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,600/i.width);c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.onerror=no;i.src=r.result};r.readAsDataURL(f)});
function build(){const c=document.documentElement.cloneNode(true);['#hd','#root','#ft','#toast'].forEach(s=>{const e=c.querySelector(s);if(e)e.innerHTML=''});c.querySelectorAll('script,style,link').forEach(e=>{if(!(e.id||'').startsWith('m-')&&!e.hasAttribute('data-m'))e.remove()});c.querySelector('#m-data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');return'<!doctype html>\n'+c.outerHTML}
async function adm(){const b=$('#adm');let u=null;try{u=window.claude&&await claude.use('user')}catch(e){}
if(!(u&&u.canEdit&&u.canEdit())){b.innerHTML='<h1>Owner access only</h1><p>Only the shop owner can change rates. Open this page while signed in to the Claude account that owns it.</p><a class="btn red" href="#home">Back to shop</a>';return}
const I=(i,k,x='')=>`data-pi="${i}" data-k="${k}" ${x}`;
b.innerHTML=`<h1>Daily rates and shop settings</h1><p class="mut">Change what you need, then tap <b>Publish rates</b>. Customers see the new rates right after publishing. Leave a rate empty to hide the Add to Cart button.</p><div style="overflow-x:auto"><table class="at"><tr><th></th><th>Product</th><th>Category</th><th>Rate ₹/kg</th><th>Available</th><th>Best seller</th><th>Change photo</th></tr>${D.products.map((p,i)=>`<tr><td><img src="${p.img}" alt=""></td><td><input class="i" ${I(i,'name')} value="${E(p.name)}" aria-label="Name"></td><td><select class="i" ${I(i,'cat')}>${cats.map(c=>`<option${c===p.cat?' selected':''}>${E(c)}</option>`).join('')}</select></td><td><input class="i" ${I(i,'price','type="number" min="0" step="1" inputmode="decimal"')} value="${p.price??''}" aria-label="Rate"></td><td><input type="checkbox" ${I(i,'on')} ${p.on?'checked':''} aria-label="Available"></td><td><input type="checkbox" ${I(i,'fav')} ${p.fav?'checked':''} aria-label="Best seller"></td><td><input type="file" accept="image/*" ${I(i,'img')}></td></tr>`).join('')}</table></div>
<h2 style="margin-top:30px">Shop settings</h2><div class="cbox"><div><label class="f">WhatsApp / phone (10 digits)<input class="i" data-s="phone" value="${E(D.phone)}"></label><label class="f">Shop address (used for Google Maps)<input class="i" data-s="address" value="${E(D.address)}"></label></div><div><label class="f">Free delivery distance<input class="i" data-s="radius" value="${E(D.radius)}"></label><label class="f">Delivery hours<input class="i" data-s="hours" value="${E(D.hours)}"></label></div></div>
<label class="f">Customer reviews, one per line as Name | review (real reviews only)<textarea class="i" id="arev" rows="4">${E(D.reviews.map(r=>r.n+' | '+r.t).join('\n'))}</textarea></label><button class="btn red lg pub" data-act="pub">Publish rates</button>`}
async function pub(b){if(!/^[6-9]\d{9}$/.test(D.phone))return toast('Enter a valid 10-digit phone number.');
D.ratesDate=new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Kolkata'});b.disabled=true;b.textContent='Publishing…';
try{const a=await claude.use('artifact');if(!a)throw 0;await a.publish(build())}catch(e){b.disabled=false;b.textContent='Publish rates';toast('Could not publish. Open this page from your Claude account and try again.')}}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();return go(a.getAttribute('href').slice(1))}
const b=e.target.closest('[data-act]');if(!b)return;const{act,id,d}=b.dataset,n=(x,y)=>Math.max(.5,+((x||1)+ +y).toFixed(1));
if(act==='q'){S.qty[id]=n(S.qty[id],d);document.querySelectorAll(`.qv[data-id="${id}"]`).forEach(x=>x.textContent=S.qty[id])}
else if(act==='add'){S.cart[id]=+((S.cart[id]||0)+(S.qty[id]||1)).toFixed(1);sv();badge();const c=$('#cc').parentNode;c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');toast(`${S.qty[id]||1} kg ${P(id).name} added to cart`)}
else if(act==='cq'){S.cart[id]=n(S.cart[id],d);sv();render()}
else if(act==='rm'){delete S.cart[id];sv();render()}
else if(act==='clr'){S.cart={};sv();render()}
else if(act==='cat'){S.cat=id;cur==='shop'?render():go('shop')}
else if(act==='menu')$('#nav').classList.toggle('open');
else if(act==='order')order();
else if(act==='msg'){const m=(S.f.cm||'').trim();if(!m)return toast('Please type a message first.');const a=document.createElement('a');a.href=wa(`Hello 786 Chicken Mart, this is ${(S.f.cn||'a customer').trim()}.\n${m}`);a.target='_blank';a.rel='noopener';a.click()}
else if(act==='pub')pub(b)});
document.addEventListener('input',e=>{const t=e.target;if(t.type==='file')return;
if(t.id==='sq'){S.q=t.value;if(cur!=='shop')go('shop');else $('#pg').innerHTML=grid();return}
if(t.dataset.f)S.f[t.dataset.f]=t.value;
if(t.dataset.pi!=null){const p=D.products[t.dataset.pi],k=t.dataset.k;p[k]=t.type==='checkbox'?t.checked:k==='price'?(t.value===''?null:Math.max(0,+t.value)):t.value}
if(t.dataset.s)D[t.dataset.s]=t.value.trim();
if(t.id==='arev')D.reviews=t.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[n,...r]=l.split('|');return r.length?{n:n.trim(),t:r.join('|').trim()}:{n:'',t:l}})});
document.addEventListener('change',async e=>{const t=e.target;if(t.type==='file'&&t.files[0]){try{const u=await resize(t.files[0]);D.products[t.dataset.pi].img=u;t.closest('tr').querySelector('img').src=u}catch(x){toast('That image could not be read.')}}});
$('#hd').innerHTML=hdr();$('#ft').innerHTML=ftr();render();
})();
</script></body></html>
